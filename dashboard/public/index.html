<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Life">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <title>Life</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Life</span>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#today" data-tab="today">Today</a>
      <a href="#health" data-tab="health">Health</a>
      <a href="#life" data-tab="life">Life</a>
      <a href="#food" data-tab="food">Food</a>
      <a href="#loops" data-tab="loops">Loops</a>
    </nav>
    <label class="together" title="Show only shared areas, for check-ins with Maddie">
      <input type="checkbox" id="together">
      <span class="switch" aria-hidden="true"></span>
      <span class="together-label">Together</span>
    </label>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="bottom-tabs" aria-label="Sections">
    <a href="#today" data-tab="today"><span class="ico" aria-hidden="true">◎</span>Today</a>
    <a href="#health" data-tab="health"><span class="ico" aria-hidden="true">♡</span>Health</a>
    <a href="#life" data-tab="life"><span class="ico" aria-hidden="true">▦</span>Life</a>
    <a href="#food" data-tab="food"><span class="ico" aria-hidden="true">◍</span>Food</a>
    <a href="#loops" data-tab="loops"><span class="ico" aria-hidden="true">↻</span>Loops</a>
  </nav>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
